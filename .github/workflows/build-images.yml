name: lawapp  -  Build and push images

# DEPRECATED (2026-06-10): image publication now happens in ci.yml build-push,
# gated on the full test chain. Kept manual-only for ad-hoc rebuilds.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (default: git SHA)"
        required: false

jobs:
  build-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/serverax/lawapp/backend:fresh-${{ github.sha }}
            ghcr.io/serverax/lawapp/backend:${{ github.sha }}
            ghcr.io/serverax/lawapp/backend:latest

      - name: Verify pull-back
        run: |
          docker pull ghcr.io/serverax/lawapp/backend:${{ github.sha }}
          echo "IMAGE_SHA=ghcr.io/serverax/lawapp/backend:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
