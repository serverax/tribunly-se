name: lawapp CI — Test, Build, Push

on:
  push:
    branches: [master, main, "release/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Integration Regression
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lawapp
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'lawapp' }}
          POSTGRES_DB: lawapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lawapp -d lawapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://lawapp:lawapp@localhost:5432/lawapp"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: lawapp
      POSTGRES_USER: lawapp
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'lawapp' }}
      PYTHONPATH: .
      # LOCAL OLLAMA ONLY — no external LLM secrets injected into CI runtime.
      LAWAPP_LLM_PROVIDER: ollama_local
      ADMIN_API_KEY: ci-admin-key-test
      DEPLOYMENT_MODE: development
      APP_BASE_URL: "http://localhost:8000"
      JWT_SECRET: ci-jwt-secret-test
      JWT_ISSUER: lawapp-issuer
      JWT_AUDIENCE: lawapp-audience
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'w8sahfTvTWZIPpQHm7f0RbvBoixo74MnMPeakhuXuZQ=' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify DB connectivity
        run: |
          python -c "
          import os, psycopg2
          db = os.environ['DATABASE_URL']
          conn = psycopg2.connect(db)
          cur = conn.cursor()
          cur.execute('SELECT current_user, current_database()')
          user, dbname = cur.fetchone()
          conn.close()
          print(f'DB OK: user={user} db={dbname}')
          "

      - name: Apply DB migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            psql "$DATABASE_URL" -f "$f"
          done

      - name: Seed rules
        run: |
          python -c "from ingestion.rules.seed_unfair_dismissal import seed; seed()"
          python -c "from ingestion.rules.seed_unpaid_wages import seed; seed()"

      - name: Verify rules seeded
        run: |
          python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          cur = conn.cursor()
          cur.execute('SELECT count(*) FROM rules')
          n = cur.fetchone()[0]
          conn.close()
          assert n > 0, f'Rules table empty: {n} rows'
          print(f'Rules: {n} rows seeded OK')
          "

      - name: Seed legislation corpus for BM25 (continue-on-error)
        run: python -m ingestion.legislation.ingest
        continue-on-error: true

      - name: Seed ACAS guidance for BM25 (continue-on-error)
        run: python -c "from ingestion.acas.ingest import ingest_acas_code; ingest_acas_code()"
        continue-on-error: true

      - name: Embed seeded legal corpus for retrieval proof
        run: |
          python -m ingestion.embeddings.embedder --table legislation
          python -m ingestion.embeddings.embedder --table acas_guidance

      - name: Run full pytest suite (same selection as scripts/prove_full_pytest_suite.sh)
        # CI and local proof MUST use the same test command. The official local runner
        # is scripts/prove_full_pytest_suite.sh (Dockerfile.ingestion image); CI runs the
        # identical pytest selection on the host runner with the same deps installed above.
        run: pytest tests/ -q --ignore=tests/integration/test_semantic_retrieval.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lawapp-integration-reports
          path: reports/
          if-no-files-found: ignore

  legal-accuracy-gate:
    name: Legal Accuracy Gate (mandatory)
    runs-on: ubuntu-latest
    needs: integration-tests

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lawapp
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'lawapp' }}
          POSTGRES_DB: lawapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lawapp -d lawapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://lawapp:lawapp@localhost:5432/lawapp"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: lawapp
      POSTGRES_USER: lawapp
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'lawapp' }}
      PYTHONPATH: .
      # NOTE: legal accuracy gate uses StubReasoningModel only.
      # Real-model/quota skips are NOT treated as pass evidence.
      APP_BASE_URL: "http://localhost:8000"
      JWT_SECRET: ci-jwt-secret-test
      JWT_ISSUER: lawapp-issuer
      JWT_AUDIENCE: lawapp-audience
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'w8sahfTvTWZIPpQHm7f0RbvBoixo74MnMPeakhuXuZQ=' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply DB migrations
        run: |
          for f in db/migrations/*.sql; do
            psql "$DATABASE_URL" -f "$f"
          done

      - name: Seed rules
        run: |
          python -c "from ingestion.rules.seed_unfair_dismissal import seed; seed()"
          python -c "from ingestion.rules.seed_unpaid_wages import seed; seed()"

      - name: Run legal accuracy gate
        run: |
          echo "Running legal accuracy regression (deterministic StubModel only)..."
          python scripts/run_legal_accuracy.py
          echo "Legal accuracy gate: PASSED"

  rules-verification-gate:
    name: Rules Verification Gate (mandatory)
    runs-on: ubuntu-latest
    needs: legal-accuracy-gate

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lawapp
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'lawapp' }}
          POSTGRES_DB: lawapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lawapp -d lawapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://lawapp:lawapp@localhost:5432/lawapp"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: lawapp
      POSTGRES_USER: lawapp
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'lawapp' }}
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply DB migrations
        run: |
          for f in db/migrations/*.sql; do
            psql "$DATABASE_URL" -f "$f"
          done

      - name: Seed rules with verification status
        run: |
          python -c "from ingestion.rules.seed_unfair_dismissal import seed; seed()"
          python -c "from ingestion.rules.seed_unpaid_wages import seed; seed()"

      - name: Run rules verification gate
        run: |
          echo "Running rules verification gate..."
          python scripts/check_rules_verification.py
          echo "Rules verification gate: PASSED"

  build-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    # Release artifacts are published ONLY after the full gate chain
    # (integration tests → legal accuracy → rules verification) is green,
    # from master or a release/** branch. The commit-SHA tag is the canonical
    # immutable release artifact; `latest` is a convenience alias on master only.
    needs: rules-verification-gate
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image (immutable SHA tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/serverax/lawapp/backend:${{ github.sha }}

      - name: Tag latest (master only)
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/serverax/lawapp/backend:latest

      - name: Verify image by immutable tag and record digest
        run: |
          docker pull ghcr.io/serverax/lawapp/backend:${{ github.sha }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/serverax/lawapp/backend:${{ github.sha }})
          echo "RELEASE_ARTIFACT_COMMIT=${{ github.sha }}"
          echo "RELEASE_ARTIFACT_DIGEST=${DIGEST}"
          echo "PUSH VERIFIED"

  production-readiness-check:
    name: Production Readiness Report (reporting only)
    runs-on: ubuntu-latest
    needs: rules-verification-gate

    env:
      PYTHONPATH: .
      DEPLOYMENT_MODE: development
      # NOTE: No DB required for this check (config/file-based only)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run production-readiness CI check
        run: |
          echo "Running production-readiness report (no DB required)..."
          python scripts/check_production_readiness_ci.py
          echo "Note: NOT_PRODUCTION_READY is expected — this is a reporting step only."

      - name: Run controlled-beta readiness check (Phase 6E, informational)
        run: |
          echo "Running controlled-beta readiness check..."
          python scripts/check_beta_readiness.py
          echo "Note: exits 0 always — reports remaining blockers for controlled beta."

  # Evolving Intelligence Stack (System Update 001) — detached optimizer job.
  # The Evolution-Gate test (rule-based proof) is the merge requirement; the DSPy
  # compilation step stays owner-key-gated (NotImplemented without an LLM key).
  dsp-optimize-prompts:
    name: DSPy Prompt Optimizer (detached, non-blocking)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lawapp
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'lawapp' }}
          POSTGRES_DB: lawapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lawapp -d lawapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://lawapp:lawapp@localhost:5432/lawapp"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: lawapp
      POSTGRES_USER: lawapp
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'lawapp' }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply DB migrations
        run: for f in db/migrations/*.sql; do psql "$DATABASE_URL" -f "$f"; done
      - name: Seed rules (for citation verification)
        run: |
          python -c "from ingestion.rules.seed_unfair_dismissal import seed; seed()"
      - name: Evolution Gate (REQUIRED for merge — rule-based proof)
        run: pytest tests/test_evolution_gate.py tests/test_integrity_framework.py -q
      - name: DSPy optimizer dry-run (detached, non-blocking)
        continue-on-error: true
        run: python -m backend.core.agentic.optimizer
