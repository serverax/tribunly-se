name: LawApp Docker Proof

on:
  push:
    branches: [ master, main, "release/**" ]
  workflow_dispatch:

jobs:
  docker-proof:
    name: Docker Build and Endpoint Proof
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lawapp
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'lawapp' }}
          POSTGRES_DB: lawapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lawapp -d lawapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lawapp:lawapp@localhost:5432/lawapp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t lawapp:ci .

      - name: Start container
        run: |
          docker run -d --name lawapp-ci \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PYTHONPATH=. \
            lawapp:ci

      - name: Wait for API
        run: |
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 3
          done
          docker logs lawapp-ci
          exit 1

      - name: Endpoint proof
        run: |
          curl -fsS http://127.0.0.1:8000/
          curl -fsS http://127.0.0.1:8000/pages/intake.html
          curl -fsS http://127.0.0.1:8000/pages/assessment.html
          curl -fsS http://127.0.0.1:8000/pages/saved_case.html
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/rules/unfair_dismissal

      - name: Dump logs on failure
        if: failure()
        run: docker logs lawapp-ci || true
