name: lawapp build images

# DEPRECATED (2026-06-10): image publication now happens in ci.yml build-push,
# gated on the full test chain. Kept manual-only for service-image rebuilds.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: lawapp-brain
            dockerfile: services/lawapp_brain/Dockerfile
          - image: lawapp-rules-engine
            dockerfile: services/lawapp_rules_engine/Dockerfile
          - image: lawapp-rag-retrieval
            dockerfile: services/lawapp_rag_retrieval/Dockerfile
          - image: lawapp-citation-guard
            dockerfile: services/lawapp_citation_guard/Dockerfile
          - image: lawapp-llm-gateway
            dockerfile: services/lawapp_llm_gateway/Dockerfile
          - image: lawapp-document-service
            dockerfile: services/lawapp_document_service/Dockerfile
          - image: lawapp-rag-ingestion
            dockerfile: services/lawapp_rag_ingestion/Dockerfile
          - image: lawapp-crawler
            dockerfile: services/lawapp_crawler/Dockerfile
          - image: lawapp-worker
            dockerfile: services/lawapp_worker/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Verify Dockerfile exists
        run: |
          test -f "${{ matrix.dockerfile }}"
          test -s "${{ matrix.dockerfile }}"
          echo "Dockerfile OK: ${{ matrix.dockerfile }}"
          sed -n '1,80p' "${{ matrix.dockerfile }}"

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: docker build -t ghcr.io/serverax/${{ matrix.image }}:${{ github.sha }} -t ghcr.io/serverax/${{ matrix.image }}:latest -f ${{ matrix.dockerfile }} .

      - name: Push
        run: |
          docker push ghcr.io/serverax/${{ matrix.image }}:${{ github.sha }}
          docker push ghcr.io/serverax/${{ matrix.image }}:latest
