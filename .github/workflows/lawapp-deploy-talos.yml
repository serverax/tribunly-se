name: LawApp Deploy to Talos

# Deploys are manual-only: never auto-deploy on push. Use deploy-staging.yml
# (immutable tag/digest) as the canonical deploy path.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/lawapp-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/lawapp-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image from backend/Dockerfile
        if: hashFiles('backend/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest

      - name: Build and push backend image from root Dockerfile
        if: hashFiles('backend/Dockerfile') == '' && hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest

      - name: Build and push frontend image
        if: hashFiles('client/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: client
          file: client/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest

      - uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl get nodes

      - name: Ensure lawapp namespaces
        run: |
          for ns in lawapp-api lawapp-rag lawapp-ai lawapp-security lawapp-monitoring; do
            kubectl create ns "$ns" --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Create lawapp secrets
        run: |
          # LOCAL OLLAMA ONLY  -  no external LLM (OPENAI/ANTHROPIC/OPENROUTER) secret
          # is created for any lawapp namespace. Inference is the internal Ollama
          # DaemonSet, configured via configmap lawapp-inference-policy.
          kubectl -n lawapp-api create secret generic lawapp-secrets \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n lawapp-rag create secret generic lawapp-secrets \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Brain needs DB + app secrets (NOT any external LLM key). GUARD: only
          # (re)apply when ALL required values are present, so a deploy with unset CI
          # secrets never overwrites a working secret with empties  -  an empty
          # ADMIN_API_KEY aborts brain startup (config_validation StartupConfigError).
          if [ -n "${{ secrets.POSTGRES_PASSWORD }}" ] && [ -n "${{ secrets.JWT_SECRET }}" ] \
             && [ -n "${{ secrets.ENCRYPTION_KEY }}" ] && [ -n "${{ secrets.ADMIN_API_KEY }}" ]; then
            kubectl -n lawapp-ai create secret generic lawapp-ai-secrets \
              --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              --from-literal=POSTGRES_USER="lawapp" \
              --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              --from-literal=ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}" \
              --from-literal=ADMIN_API_KEY="${{ secrets.ADMIN_API_KEY }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "WARN: required CI secrets not all set  -  preserving existing lawapp-ai-secrets (not overwriting with empties)."
            kubectl -n lawapp-ai get secret lawapp-ai-secrets >/dev/null 2>&1 \
              || echo "ERROR: lawapp-ai-secrets missing AND CI secrets unset  -  brain will fail; configure repo secrets."
          fi

      - name: Apply manifests
        run: |
          if [ -d infra/k8s ]; then
            kubectl apply -f infra/k8s/
          elif [ -d k8s ]; then
            kubectl apply -f k8s/
          else
            echo "No k8s manifests found"
            exit 1
          fi

      - name: Update deployment images
        run: |
          if kubectl -n lawapp-api get deployment lawapp-backend >/dev/null 2>&1; then
            kubectl -n lawapp-api set image deployment/lawapp-backend lawapp-backend=${IMAGE_BACKEND}:${GITHUB_SHA}
          fi

          if kubectl -n lawapp-api get deployment lawapp-frontend >/dev/null 2>&1; then
            kubectl -n lawapp-api set image deployment/lawapp-frontend lawapp-frontend=${IMAGE_FRONTEND}:${GITHUB_SHA}
          fi

      - name: Rollout proof
        run: |
          kubectl get pods -n lawapp-api
          kubectl get pods -n lawapp-rag || true
          kubectl get pods -n lawapp-ai || true
          kubectl get pods -n lawapp-security || true
          kubectl get pods -n lawapp-monitoring || true
