name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: serverax/lawapp
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: Dockerfile
            image: backend
          - name: frontend
            context: ./client/next
            file: Dockerfile
            image: frontend
          - name: control-plane
            context: ./control-plane
            file: Dockerfile
            image: control-plane
          - name: lawapp-redaction-service
            context: ./backend/services/lawapp-redaction-service
            file: Dockerfile
            image: lawapp-redaction-service
          - name: lawapp-rules-service
            context: ./backend/services/lawapp-rules-service
            file: Dockerfile
            image: lawapp-rules-service
          - name: lawapp-rag-service
            context: ./backend/services/lawapp-rag-service
            file: Dockerfile
            image: lawapp-rag-service

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ env.RELEASE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
