<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System health  -  lawapp Admin</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-shell">
  <header class="admin-topbar">
    <span class="brand">lawapp Admin</span>
    <nav id="admin-nav"></nav>
  </header>
  <div id="admin-denied" class="admin-denied" style="display:none;"><h1>Access denied</h1></div>
  <div id="admin-content" class="admin-content">
    <h1>System health</h1>
    <pre id="health-json" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:1rem;overflow:auto;font-size:0.85rem;"></pre>
    <p id="admin-status" class="cos-muted" style="margin-top:1rem;"></p>
  </div>
  <script src="/js/auth.js"></script>
  <script src="/js/admin-shell.js"></script>
  <script>
  (async function () {
    if (!(await LAWAPP_ADMIN.init())) return;
    try {
      var data = await LAWAPP_ADMIN.fetch("/admin/system-health");
      document.getElementById("health-json").textContent = JSON.stringify(data, null, 2);
      document.getElementById("admin-status").textContent = "Generated " + (data.generated_at || "");
    } catch (e) {
      document.getElementById("admin-status").textContent = e.message;
    }
  })();
  </script>
</body>
</html>
