<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users  -  lawapp Admin</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-shell">
  <header class="admin-topbar">
    <span class="brand">lawapp Admin</span>
    <nav id="admin-nav"></nav>
  </header>
  <div id="admin-denied" class="admin-denied" style="display:none;"><h1>Access denied</h1></div>
  <div id="admin-content" class="admin-content">
    <h1>Users</h1>
    <div class="admin-table-wrap" style="margin-top:1rem;">
      <table class="admin-table" id="users-table">
        <thead><tr><th>Email</th><th>Admin</th><th>Cases</th><th>Subscription</th><th>Joined</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p id="admin-status" class="cos-muted" style="margin-top:1rem;"></p>
  </div>
  <script src="/js/auth.js"></script>
  <script src="/js/admin-shell.js"></script>
  <script>
  (async function () {
    if (!(await LAWAPP_ADMIN.init())) return;
    var tbody = document.querySelector("#users-table tbody");
    try {
      var data = await LAWAPP_ADMIN.fetch("/admin/users");
      (data.users || []).forEach(function (u) {
        var tr = document.createElement("tr");
        tr.innerHTML = "<td>" + (u.email || u.user_id) + "</td><td>" + (u.is_admin ? "yes" : "no") +
          "</td><td>" + (u.case_count || 0) + "</td><td>" + (u.subscription_status || "") +
          "</td><td>" + (u.created_at || "") + "</td>";
        tbody.appendChild(tr);
      });
      document.getElementById("admin-status").textContent =
        "Showing " + (data.count || 0) + " users";
    } catch (e) {
      document.getElementById("admin-status").textContent = e.message;
    }
  })();
  </script>
</body>
</html>
