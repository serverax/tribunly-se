<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - lawapp Case OS</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/case-os.css">
</head>
<body class="case-os" data-case-os-page="dashboard">

<div class="legal-notice" role="note"><strong>Not a law firm. Not legal advice.</strong></div>

<div id="case-os-main">
  <div class="cos-page-header">
    <h1>Dashboard</h1>
    <p id="dash-subtitle">Your employment cases at a glance</p>
  </div>
  <div id="dash-error" class="cos-error" style="display:none;"></div>
  <div id="dash-loading" class="cos-loading">Loading cases…</div>
  <div id="dash-content" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;">
      <p id="user-email" style="margin:0;color:var(--muted);font-size:0.9rem;"></p>
      <a href="/pages/case-intake.html" class="btn btn-primary">Start new case</a>
    </div>
    <div id="case-grid" class="cos-grid cos-grid-2"></div>
    <div id="no-cases" class="cos-empty" style="display:none;">
      <p>No saved cases yet.</p>
      <a href="/pages/case-intake.html" class="btn btn-outline">Build your first case</a>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/api-client.js"></script>
<script src="/js/fetchWithAuth.js"></script>
<script src="/js/case-engine.js"></script>
<script src="/js/case-components.js"></script>
<script src="/js/app-shell.js"></script>
<script>
(function () {
  CaseOSShell.init({ page: "dashboard" }).then(function (ok) {
    if (!ok) return;
    var grid = document.getElementById("case-grid");
    var loading = document.getElementById("dash-loading");
    var content = document.getElementById("dash-content");
    var noCases = document.getElementById("no-cases");
    var errEl = document.getElementById("dash-error");

    LAWAPP_AUTH.getCurrentUser().then(function (u) {
      if (u && u.email) document.getElementById("user-email").textContent = u.email;
    });

    CaseEngine.listCases().then(function (cases) {
      loading.style.display = "none";
      content.style.display = "block";
      if (!cases.length) {
        noCases.style.display = "block";
        return;
      }
      cases.forEach(function (c) {
        var card = document.createElement("article");
        card.className = "cos-card cos-case-card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        var id = c.case_id || c.id;
        var strength = (c.assessment && c.assessment.strength) || "uncertain";
        var pillCls = strength === "high" ? "cos-pill-green" : strength === "low" ? "cos-pill-red" : "cos-pill-amber";

        var h3 = document.createElement("h3");
        h3.textContent = CaseEngine.formatClaimType(c.claim_type);
        var meta = document.createElement("div");
        meta.className = "cos-case-meta";
        meta.textContent = "Status: " + (c.status || "diagnosis");
        var pill = document.createElement("span");
        pill.className = "cos-pill " + pillCls;
        pill.textContent = strength + " strength";
        var next = document.createElement("p");
        next.style.fontSize = "0.88rem";
        next.style.color = "var(--muted)";
        next.textContent = (c.assessment && c.assessment.reasoning_summary) || "Open case for analysis and next steps.";
        var dl = c.key_dates && (c.key_dates.deadline_date || c.key_dates.limitation_date);
        if (dl) {
          var dlP = document.createElement("p");
          dlP.style.fontSize = "0.82rem";
          dlP.style.marginTop = "0.5rem";
          dlP.textContent = "Deadline: " + dl;
          card.appendChild(dlP);
        }
        card.append(h3, meta, pill, next);
        card.addEventListener("click", function () {
          CaseEngine.setActiveCaseId(id);
          window.location.href = "/pages/my-case.html?case_id=" + encodeURIComponent(id);
        });
        grid.appendChild(card);
      });
    }).catch(function (e) {
      loading.style.display = "none";
      errEl.style.display = "block";
      errEl.textContent = e.message || "Failed to load cases";
    });
  });
})();
</script>
</body>
</html>
