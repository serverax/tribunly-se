<script src="/js/auth.js"></script>
<script src="/js/api-client.js"></script>
<script src="/js/case-engine.js"></script>
<script src="/js/case-components.js"></script>
<script src="/js/app-shell.js"></script>
<script>
(function() {
  if (!LAWAPP_AUTH.ensureLoggedIn()) return;
  var caseId = new URLSearchParams(location.search).get('case_id');

  async function resolveCaseId() {
    if (caseId) return caseId;
    var cases = await CaseEngine.listCases();
    return cases[0] && cases[0].case_id;
  }

  async function init() {
    try {
      caseId = await resolveCaseId();
      if (!caseId) throw new Error('Save a case to view its timeline.');
      CaseEngine.setActiveCaseId(caseId);
      var data = await CaseEngine.getTimeline(caseId);
      document.getElementById('tl-loading').style.display = 'none';
      document.getElementById('tl-content').style.display = 'block';
      document.getElementById('tl-note').textContent = data.timeline_note || 'Informational chronology from your saved key dates and events.';
      var events = data.events || data.timeline || [];
      LAWAPP_COMPONENTS.Timeline(document.getElementById('tl-mount'), events);
    } catch (e) {
      document.getElementById('tl-loading').style.display = 'none';
      var err = document.getElementById('tl-error');
      err.style.display = 'block';
      err.textContent = e.message || 'Could not load timeline.';
    }
  }
  init();
})();
</script>
