[package]
name = "lawapp-wasm"
version = "0.1.0"
edition = "2021"
description = "Deterministic legal arithmetic subsystem for lawapp."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
chrono = "0.4"
