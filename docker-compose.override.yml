# docker-compose.override.yml  -  local dev only (auto-loaded).
# Aligns the database password to 'lawapp' across every service so the backend,
# outbox-worker, ingestion runs, proof scripts and pytest all authenticate the
# same way. Keeps .env untouched. NOT for production.
services:
  db:
    environment:
      POSTGRES_PASSWORD: lawapp
    ports:
      - "5435:5432"
  backend:
    environment:
      POSTGRES_PASSWORD: lawapp
      ENCRYPTION_KEY: 1W5as0aC23E5QI9GlSoyh_3Zusj4b2OvQFX-9Gm5mqY=
      PAYMENT_MODE: test
  outbox-worker:
    environment:
      POSTGRES_PASSWORD: lawapp
  # Test/ingestion runners must authenticate the same way, else pytest fails
  # closed with "password authentication failed" and every DB-backed test breaks.
  ingestion:
    environment:
      POSTGRES_PASSWORD: lawapp
  db-bootstrap:
    environment:
      POSTGRES_PASSWORD: lawapp
  lawapp-rules-service:
    environment:
      DATABASE_URL: postgresql://lawapp:lawapp@db:5432/lawapp
  lawapp-audit-service:
    environment:
      DATABASE_URL: postgresql://lawapp:lawapp@db:5432/lawapp
  lawapp-case-service:
    environment:
      DATABASE_URL: postgresql://lawapp:lawapp@db:5432/lawapp
  lawapp-graph-rag-service:
    environment:
      DATABASE_URL: postgresql://lawapp:lawapp@db:5432/lawapp
  lawapp-redaction-service:
    environment:
      DATABASE_URL: postgresql://lawapp:lawapp@db:5432/lawapp
  lawapp-admin-service:
    environment:
      DATABASE_URL: postgresql://lawapp:lawapp@db:5432/lawapp
  lawapp-notification-service:
    environment:
      DATABASE_URL: postgresql://lawapp:lawapp@db:5432/lawapp
  lawapp-rag-service:
    environment:
      DATABASE_URL: postgresql://lawapp:lawapp@db:5432/lawapp
      LAWAPP_OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: bge-large-en-v1.5
      EMBEDDING_DIM: "1024"
