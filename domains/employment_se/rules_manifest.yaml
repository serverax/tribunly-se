- topic: mbl_collective_agreement_boundary
  act: MBL 1976:580
  section_ref: 4 §
  status: DRAFT-UNVALIDATED
  lawyer_signoff_gate: D-SE5
  source_url: https://data.riksdagen.se/dokument/sfs-1976-580.html
  quote: "4 § Ett avtal är ogiltigt i den mån det innebär att en \n\nrättighet eller\
    \ skyldighet enligt denna lag upphävs eller \n\ninskränks.\n\n\n\nGenom ett kollektivavtal\
    \ får det dock göras avvikelser från \n\n11, 12, 14 och 19 §§, 20 § första stycket,\
    \ 21, 22 och 28 §§,"
  note_sv: Kollektivavtal kan avvika från flera MBL-regler. Kontrollera alltid avtal
    före svaret.
  note_en: Collective agreements can override several MBL rules; verify the agreement
    before answering.
  note_ar: يمكن لاتفاقيات العمل الجماعية أن تستبعد أو تغيّر عدة قواعد في قانون المشاركة.
    تحقق من الاتفاق أولًا.
- topic: arbetstids_collective_agreement_boundary
  act: Arbetstidslag 1982:673
  section_ref: 3 §
  status: DRAFT-UNVALIDATED
  lawyer_signoff_gate: D-SE5
  source_url: https://data.riksdagen.se/dokument/sfs-1982-673.html
  quote: "3 § Genom ett kollektivavtal som har slutits eller godkänts av \r\nen central\
    \ arbetstagarorganisation får det göras undantag från \r\nlagen i dess helhet\
    \ eller avvikelser från 5 och 6 §§, 7 § \r\nandra stycket, 8-10 b §§, 12-14 §§\
    \ samt 15 § andra och tredje \r\nstyckena. Vidare får raster bytas ut mot måltidsuppehåll\
    \ genom \r\nsådana kollektivavtal. Avvikelser från 10 b § får dock inte \r\ninnebära\
    \ en längre beräkningsperiod än tolv månader. \r\nAvvikelser från 12 § får göras\
    \ endast om avtalet respekterar \r\ndet övergripande skydd för arbetstagare som\
    \ avses i \r\nEuropaparlamentets och rådets direktiv (EU) 2019/1152 av den \r\n\
    20 juni 2019 om tydliga och förutsägbara arbetsvillkor i \r\nEuropeiska unionen,\
    \ i den ursprungliga lydelsen.\r\n\r\nAvvikelser från 8 och 8 a §§, 9 § andra\
    \ stycket, 10 och"
  note_sv: Arbetstidsregler kan avtalas bort eller ändras genom centrala kollektivavtal.
  note_en: Working-time rules can be overridden or adjusted by central collective
    agreements.
  note_ar: يمكن تعديل قواعد وقت العمل أو استبعادها باتفاقيات جماعية مركزية.
- topic: semester_collective_agreement_boundary
  act: Semesterlag 1977:480
  section_ref: 2 a §
  status: DRAFT-UNVALIDATED
  lawyer_signoff_gate: D-SE5
  source_url: https://data.riksdagen.se/dokument/sfs-1977-480.html
  quote: "2 a § Genom avtal får avvikelse göras från 5, 12, 12 b, 19-21\r\noch 30\
    \ a §§, i den utsträckning som framgår av de\r\nbestämmelserna.\r\n\r\nGenom kollektivavtal,\
    \ som på arbetstagarsidan har slutits\r\neller godkänts av en central arbetstagarorganisation,\
    \ får\r\navvikelse göras från 3, 3 a, 9, 11 § andra stycket, 16-16 b,\r\n22, 26,\
    \ 26 a, 29, 29 a och 30 §§.\r\n\r\nEn arbetsgivare, som är bunden av ett kollektivavtal\
    \ som\r\nomfattar frågor som avses i första och andra styckena, får i\r\ndessa\
    \ frågor tillämpa avtalet även på en arbetstagare som\r\ninte är medlem av den\
    \ avtalsslutande\r\narbetstagarorganisationen. Detta gäller under förutsättning\r\
    \natt arbetstagaren sysselsätts i arbete som avses med avtalet\r\noch inte omfattas\
    \ av något annat tillämpligt kollektivavtal.\r\nLag (2009:1439).\r\n\r\nSemesterår\
    \ och intjänandeår"
  note_sv: Semesterregler har flera avtalsportar; läs alltid kollektivavtalet först.
  note_en: Vacation rules have several collective-agreement gateways; read the agreement
    first.
  note_ar: لقواعد الإجازة أبواب متعددة عبر الاتفاقات الجماعية؛ اقرأ الاتفاق أولًا.
- topic: foraldraledig_collective_agreement_boundary
  act: Föräldraledighetslag 1995:584
  section_ref: 2 §
  status: DRAFT-UNVALIDATED
  lawyer_signoff_gate: D-SE5
  source_url: https://data.riksdagen.se/dokument/sfs-1995-584.html
  quote: "2 § Ett avtal som innebär att arbetstagares rättigheter enligt\r\ndenna\
    \ lag inskränks är ogiltigt i den delen.\r\n\r\nGenom ett kollektivavtal som på\
    \ arbetstagarsidan har slutits\r\neller godkänts av en sådan central arbetstagarorganisation\
    \ som\r\navses i lagen (1976:580) om medbestämmande i arbetslivet får\r\ndet dock\
    \ göras avvikelser från lagen i fråga om\r\n\r\n- anmälan om ledighet (13 §),\r\
    \n\r\n- tiden för arbetstagarens underrättelse om återgång till\r\narbete (15\
    \ § andra stycket),\r\n\r\n- den tid arbetsgivaren har rätt att skjuta upp arbetstagarens\r\
    \nåtergång till arbete (15 § tredje stycket).\r\n\r\nGenom ett kollektivavtal\
    \ som kommit till på det sätt som anges\r\ni andra stycket får även bestämmas\
    \ den närmare tillämpningen i\r\nfråga om\r\n\r\n- ledighetens förläggning (11\
    \ och 12 §§),\r\n\r\n- förbudet mot missgynnande behandling (16 §).\r\n\r\nArbetsgivare\
    \ som är bundna av ett kollektivavtal enligt andra\r\neller tredje stycket, får\
    \ tillämpa avtalet även på arbetstagare\r\nsom inte tillhör den avtalsslutande\
    \ arbetstagarorganisationen,\r\nom arbetstagarna sysselsätts i arbete som avses\
    \ med avtalet och\r\ninte omfattas av något annat tillämpligt kollektivavtal.\r\
    \nLag (2006:442).\r\n\r\nRätten till ledighet\r\n\r\nÖversikt över de olika formerna\
    \ av föräldraledighet för arbetstagare"
  note_sv: Föräldraledighet kan bara avtalas bort inom de snäva uttryckliga undantagen.
  note_en: Parental leave can be adjusted only inside the narrow express exceptions.
  note_ar: يمكن تعديل إجازة الوالدين فقط ضمن الاستثناءات الضيقة الصريحة.
- topic: sjll_collective_agreement_boundary
  act: SjLL 1991:1047
  section_ref: 2 §
  status: DRAFT-UNVALIDATED
  lawyer_signoff_gate: D-SE5
  source_url: https://data.riksdagen.se/dokument/sfs-1991-1047.html
  quote: "2 § Ett avtal som innebär att arbetstagarens rättigheter \r\nenligt denna\
    \ lag upphävs eller inskränks är ogiltigt i den \r\ndelen.\r\n\r\nUtan hinder\
    \ av första stycket får avvikelser göras från 8 § \r\nandra stycket, 9 § och 10\
    \ a § första och andra styckena genom \r\nkollektivavtal som på arbetstagarsidan\
    \ har slutits eller \r\ngodkänts av en sådan central arbetstagarorganisation som\
    \ \r\navses i lagen (1976:580) om medbestämmande i arbetslivet. Den \r\nnärmare\
    \ beräkningen av sjuklönens storlek enligt 6 § första \r\nstycket och avdrag enligt\
    \ andra stycket samma paragraf får \r\nockså bestämmas på det sättet. En arbetsgivare\
    \ som är bunden \r\nav ett sådant kollektivavtal får tillämpa avtalet även på\
    \ \r\narbetstagare som inte tillhör den avtalsslutande \r\narbetstagarorganisationen,\
    \ under förutsättning att de \r\nsysselsätts i arbete som avses med avtalet och\
    \ inte omfattas \r\nav något annat tillämpligt kollektivavtal. Lag (2018:648)."
  note_sv: Sjuklönereglerna har begränsade kollektivavtalsportar; karensavdrag ska
    inte gissas bort.
  note_en: Sick-pay rules have limited collective-agreement gateways; do not guess
    away the karens deduction.
