- rule_key: dismissal.sakliga_skal_anchor
  claim_type: dismissal
  status: DRAFT-UNVALIDATED
  lawyer_signoff_gate: D-SE5
  sfs_number: 1982:80
  section_ref: 7 §
  source_url: https://data.riksdagen.se/dokument/sfs-1982-80.html
  value: sakliga skäl
  quote: "7 § Uppsägning från arbetsgivarens sida ska grunda sig på \n\nsakliga skäl.\
    \ Sakliga skäl kan vara arbetsbrist eller \n\nförhållanden som hänför sig till\
    \ arbetstagaren personligen.\n\n\n\nEn uppsägning är inte grundad på sakliga skäl\
    \ om det är \n\nskäligt att kräva att arbetsgivaren bereder arbetstagaren \n\n\
    annat arbete hos sig. Om arbetsgivaren tidigare har berett \n\narbetstagaren annat\
    \ arbete hos sig på grund av förhållanden \n\nsom hänför sig till arbetstagaren\
    \ personligen, ska \n\narbetsgivaren anses ha uppfyllt sin omplaceringsskyldighet,\
    \ om \n\ndet inte finns särskilda skäl.\n\n\n\nVid en sådan övergång av ett företag,\
    \ en verksamhet eller en \n\ndel av en verksamhet som sägs i 6 b § ska övergången\
    \ i sig \n\ninte utgöra sakliga skäl för att säga upp arbetstagaren. Detta \n\n\
    förbud ska dock inte hindra uppsägningar som sker av \n\nekonomiska, tekniska\
    \ eller organisatoriska skäl där \n\nförändringar i arbetsstyrkan ingår.\n\n\n\
    \nOm uppsägningen beror på förhållanden som hänför sig till \n\narbetstagaren\
    \ personligen, får den inte grundas enbart på \n\nomständigheter som arbetsgivaren\
    \ har känt till antingen mer än \n\ntvå månader innan underrättelse lämnades enligt\
    \ 30 § eller, om \n\nnågon sådan underrättelse inte lämnats, två månader före\
    \ \n\ntidpunkten för uppsägningen. Arbetsgivaren får dock grunda \n\nuppsägningen\
    \ enbart på omständigheter som arbetsgivaren har \n\nkänt till mer än två månader,\
    \ om tidsöverdraget berott på att \n\narbetsgivaren på arbetstagarens begäran\
    \ eller med \n\narbetstagarens medgivande dröjt med underrättelsen eller \n\n\
    uppsägningen eller om det finns synnerliga skäl för att \n\nåberopa omständigheterna.\
    \ Lag (2022:835)."
  boundary_note: Collective-agreement overrides can narrow or reshape this through
    LAS 2 b § and 2 c §.
