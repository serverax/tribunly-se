# employment_uk  -  citation acceptance policy (enforced at RAG/validation time).
domain: employment_uk

trust_order:
  - primary_legislation        # legislation.gov.uk  -  highest
  - official_guidance_acas
  - official_guidance_govuk
  - tribunal_procedure
  - case_law                   # licence-gated; only when permitted + verified
  - internal_template          # never a primary authority

rag_acceptance:
  citation_must_resolve_to_db_row: true
  source_url_required: true
  chunk_must_have_parent_source: true
  reject_if_stale: true
  reject_if_outside_licence_policy: true
  reject_fabricated_citation: true

primary_authority_only_from:
  - legislation
  - acas_guidance
  - official_guidance
secondary_as_commentary_only: true   # solicitor/news/AI text never primary authority
