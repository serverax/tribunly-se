# Statutory Instruments — annual Employment Rights (Increase of Limits) Orders.
# These set the week's-pay cap, max compensatory award and min basic award. The
# values live in the cited `rules` table (effective-dated); the Order text is
# stored in `legislation` (leg_type=uksi). Ingested by ingestion.rules.seed_limits_orders.
# SI numbers confirmed via legislation.gov.uk title resolution (2026-06-05).
statutory_instruments:
  series: Employment Rights (Increase of Limits) Order
  leg_type: uksi
  parser_type: clml_xml
  licence_type: open_government_licence
  orders:
    - { year: 2021, si_no: "208", url: https://www.legislation.gov.uk/uksi/2021/208 }
    - { year: 2022, si_no: "182", url: https://www.legislation.gov.uk/uksi/2022/182 }
    - { year: 2023, si_no: "318", url: https://www.legislation.gov.uk/uksi/2023/318 }
    - { year: 2024, si_no: "213", url: https://www.legislation.gov.uk/uksi/2024/213 }
    - { year: 2025, si_no: "348", url: https://www.legislation.gov.uk/uksi/2025/348 }
    - { year: 2026, si_no: "310", url: https://www.legislation.gov.uk/uksi/2026/310 }  # current

guidance:
  - source_name: ACAS Code of Practice on Disciplinary and Grievance Procedures
    source_type: acas
    base_url: https://www.acas.org.uk
    licence_type: acas_public_guidance
    table: acas_guidance
  - source_name: GOV.UK employment guidance
    source_type: govuk
    base_url: https://www.gov.uk
    licence_type: open_government_licence
    table: official_guidance

case_law:
  source_type: find_case_law
  base_url: https://caselaw.nationalarchives.gov.uk
  licence_type: open_justice_licence
  bulk_allowed: false                      # licence-gated; see licence_policy.yaml
  computational_analysis_allowed: false
  table: case_law_documents
