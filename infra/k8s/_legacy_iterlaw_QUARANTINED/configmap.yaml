---
# IterLaw lawapp  -  non-secret runtime configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: lawapp-config
  namespace: iterlaw-ai
data:
  DEPLOYMENT_MODE: "production"
  LAWAPP_AUTH_MODE: "jwt"
  KEY_MANAGEMENT_MODE: "kms_stub"   # change to "aws_kms" when KMS is configured
  PAYMENT_MODE: "mock"              # change to "stripe_test" or "stripe_live" when ready
  OPENROUTER_ENABLED: "false"
  WORKHORSE_MODEL_ID: "claude-haiku-4-5-20251001"
  EMBEDDING_DIM: "1536"
  EMBEDDING_MODEL: "text-embedding-3-small"
  APP_BASE_URL: "https://iterlaw.ai"
  LOG_LEVEL: "INFO"
