---
# IterLaw — external PostgreSQL + pgvector connection
#
# Option A (recommended for MVP): Use an external managed Postgres service
# (e.g. Azure Database for PostgreSQL Flexible Server with pgvector extension).
# The connection string is stored as a secret (see secrets.example.yaml).
# No in-cluster Postgres pod needed — reduces ops burden.
#
# Option B: Deploy in-cluster Postgres (see postgres-pgvector.yaml if needed).
#
# This ConfigMap documents the connection intent only.
# The actual DATABASE_URL is in lawapp-secrets (Secret), not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lawapp-db-config
  namespace: iterlaw-ai
data:
  DB_HOST: "REPLACE_WITH_POSTGRES_HOST"
  DB_PORT: "5432"
  DB_NAME: "lawapp"
  DB_SSL_MODE: "require"
  PGVECTOR_EXTENSION: "required"
  NOTE: |
    pgvector must be enabled: CREATE EXTENSION IF NOT EXISTS vector;
    Run migrations in order: db/migrations/001_initial.sql through 013_phase7d_envelope_encryption.sql
