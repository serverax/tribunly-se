---
# IterLaw — ACAS guidance ingestion job
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-acas
  namespace: iterlaw-rag
  labels:
    project: iterlaw
    job-type: ingestion
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest
          image: ghcr.io/serverax/lawapp/backend:${GIT_SHA}
          command: ["python", "-m", "ingestion.acas.ingest"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: lawapp-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
