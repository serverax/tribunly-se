---
# IterLaw  -  NetworkPolicy: backend can reach DB and egress for API calls.
# Only allow ingress to backend from within the cluster.
# No public ingress until health is proven.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lawapp-backend-netpol
  namespace: iterlaw-ai
spec:
  podSelector:
    matchLabels:
      app: lawapp-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: iterlaw-ai
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: iterlaw-monitoring
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS to external APIs (Anthropic, legislation.gov.uk, AWS KMS)
    - ports:
        - port: 443
          protocol: TCP
    # Allow PostgreSQL
    - ports:
        - port: 5432
          protocol: TCP
