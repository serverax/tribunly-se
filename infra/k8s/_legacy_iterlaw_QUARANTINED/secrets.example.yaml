---
# IterLaw secrets — EXAMPLE FILE ONLY. DO NOT COMMIT REAL VALUES.
# Create real secrets via: kubectl create secret generic lawapp-secrets \
#   --from-literal=DATABASE_URL='...' --from-literal=ANTHROPIC_API_KEY='...' \
#   -n iterlaw-ai --dry-run=client -o yaml | kubectl apply -f -
#
# Required secrets for lawapp backend:
apiVersion: v1
kind: Secret
metadata:
  name: lawapp-secrets
  namespace: iterlaw-ai
type: Opaque
stringData:
  # PostgreSQL connection string (pgvector enabled)
  DATABASE_URL: "postgresql://user:password@host:5432/lawapp"
  # Fernet encryption key for PII at rest (generated via Fernet.generate_key())
  ENCRYPTION_KEY: "REPLACE_WITH_FERNET_KEY"
  # Admin API key for /admin/* endpoints
  ADMIN_API_KEY: "REPLACE_WITH_STRONG_RANDOM_KEY"
  # Anthropic API key for Claude Haiku reasoning + ML classification
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_WITH_REAL_KEY"
  # JWT secret for HS256 (dev only; use RS256+JWKS in production)
  JWT_SECRET: "REPLACE_WITH_STRONG_RANDOM_SECRET"
  # OpenAI API key for pgvector embeddings (optional; BM25 active without it)
  OPENAI_API_KEY: "sk-REPLACE_IF_USING_OPENAI_EMBEDDINGS"
  # AWS KMS (optional; use kms_stub mode without it)
  AWS_ACCESS_KEY_ID: "REPLACE_IF_USING_AWS_KMS"
  AWS_SECRET_ACCESS_KEY: "REPLACE_IF_USING_AWS_KMS"
  AWS_KMS_KEY_ARN: "arn:aws:kms:REPLACE_IF_USING_AWS_KMS"
