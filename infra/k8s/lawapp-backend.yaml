apiVersion: apps/v1
kind: Deployment
metadata:
  name: lawapp-backend
  namespace: lawapp-api
  labels:
    app: lawapp-backend
    part-of: lawapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lawapp-backend
  template:
    metadata:
      labels:
        app: lawapp-backend
        part-of: lawapp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/serverax/lawapp/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_HOST
              value: "lawapp-postgres.lawapp-api.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
          envFrom:
            - configMapRef:
                name: lawapp-config
            - secretRef:
                name: lawapp-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      imagePullSecrets:
        - name: ghcr-pull-secret
---
apiVersion: v1
kind: Service
metadata:
  name: lawapp-backend
  namespace: lawapp-api
  labels:
    app: lawapp-backend
    part-of: lawapp
spec:
  selector:
    app: lawapp-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
