apiVersion: batch/v1
kind: Job
metadata:
  name: lawapp-ingestion-legislation-latest
  namespace: lawapp-rag
  labels:
    app: lawapp-ingestion
    part-of: lawapp
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ingestion
        image: ghcr.io/serverax/lawapp/backend:0fec3d8
        imagePullPolicy: Always
        command: ["python", "-m", "ingestion.legislation.ingest"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
        envFrom:
        - configMapRef:
            name: lawapp-config
        - secretRef:
            name: lawapp-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      restartPolicy: OnFailure
      imagePullSecrets:
      - name: ghcr-pull-secret
---
