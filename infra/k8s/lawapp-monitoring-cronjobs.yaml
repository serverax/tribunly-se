              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
            envFrom:
            - configMapRef:
                name: lawapp-config
            - secretRef:
                name: lawapp-secrets
          restartPolicy: OnFailure
          imagePullSecrets:
          - name: ghcr-pull-secret
