---
# lawapp Monitoring  -  namespace: lawapp-monitoring
# Health check CronJob + source freshness reporter.
apiVersion: v1
kind: Namespace
metadata:
  name: lawapp-monitoring
  labels:
    part-of: lawapp
---
# Source freshness CronJob  -  runs daily at 06:00 UTC
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lawapp-freshness-check
  namespace: lawapp-monitoring
  labels:
    app: lawapp-freshness
    part-of: lawapp
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
          - name: freshness
            image: ghcr.io/serverax/lawapp/backend:970b95c60d1dbce57474a02909b22c5e9f7f75a0
            imagePullPolicy: Always
            command: ["python", "-m", "ingestion.freshness.report"]
            env:
            - name: POSTGRES_HOST
              value: "lawapp-postgres.lawapp-api.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "lawapp"
            - name: POSTGRES_USER
              value: "lawapp"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lawapp-secrets
                  key: POSTGRES_PASSWORD
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir: {}
---
# Health probe CronJob  -  every 5 minutes
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lawapp-health-probe
  namespace: lawapp-monitoring
  labels:
    app: lawapp-health-probe
    part-of: lawapp
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
          - name: probe
            image: curlimages/curl:latest
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
            command:
            - /bin/sh
            - -c
            - |
              # Service port is 80 (targetPort 8000)
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://lawapp-backend.lawapp-api.svc.cluster.local/health)
              echo "Health check status: $STATUS"
              [ "$STATUS" = "200" ] || exit 1
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir: {}
