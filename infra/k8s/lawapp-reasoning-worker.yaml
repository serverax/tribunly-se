apiVersion: apps/v1
kind: Deployment
metadata:
  name: lawapp-reasoning-worker
  namespace: lawapp-ai
  labels:
    app: lawapp-reasoning-worker
    part-of: lawapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lawapp-reasoning-worker
  template:
    metadata:
      labels:
        app: lawapp-reasoning-worker
        part-of: lawapp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reasoning
          image: ghcr.io/serverax/lawapp/backend:latest
          imagePullPolicy: Always
          # Long-lived outbox worker (drains the transactional outbox queue;
          # clean SIGTERM shutdown). backend.core.pipeline is a library module,
          # not a daemon  -  running it here caused a restart loop.
          command: ["python", "-m", "backend.core.outbox_worker"]
          env:
            # Same DB credential source as lawapp-brain  -  the POSTGRES_* values
            # in lawapp-ai-secrets do not match the lawapp-postgres instance.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lawapp-brain-db
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: lawapp-ai-config
            - secretRef:
                name: lawapp-ai-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      imagePullSecrets:
        - name: ghcr-pull-secret
