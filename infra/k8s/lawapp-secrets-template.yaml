# DO NOT COMMIT REAL VALUES. Fill in and apply manually:
#
#   kubectl create secret generic lawapp-secrets -n lawapp-api \
#     --from-literal=DATABASE_URL='postgresql://lawapp:REAL_PWD@lawapp-postgres.lawapp-rag.svc.cluster.local:5432/lawapp' \
#     --from-literal=JWT_SECRET='REAL_JWT_SECRET' \
#     --from-literal=ENCRYPTION_KEY='REAL_ENCRYPTION_KEY' \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-REAL' \
#     --from-literal=OPENAI_API_KEY='sk-REAL' \
#     --from-literal=STRIPE_SECRET_KEY='sk_live_REAL' \
#     --from-literal=STRIPE_WEBHOOK_SECRET='whsec_REAL' \
#     --from-literal=ADMIN_API_KEY='REAL_ADMIN_KEY'
#
#   kubectl create secret generic lawapp-postgres-auth -n lawapp-rag \
#     --from-literal=POSTGRES_PASSWORD='REAL_POSTGRES_PWD'
#
#   kubectl create secret generic lawapp-ai-secrets -n lawapp-ai \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-REAL' \
#     --from-literal=DATABASE_URL='postgresql://lawapp:REAL_PWD@lawapp-postgres.lawapp-rag.svc.cluster.local:5432/lawapp'
#
#   kubectl create secret generic lawapp-rag-secrets -n lawapp-rag \
#     --from-literal=POSTGRES_PASSWORD='REAL_POSTGRES_PWD' \
#     --from-literal=OPENAI_API_KEY='sk-REAL'
#
# Secret names used by deployments:
#   lawapp-api:        lawapp-secrets, lawapp-postgres-auth (cross-ns via env)
#   lawapp-ai:         lawapp-ai-secrets
#   lawapp-rag:        lawapp-rag-secrets, lawapp-postgres-auth
#   lawapp-security:   (inherits from api)
#   lawapp-monitoring: (no sensitive secrets needed)
#
# ─────────────────────────────────────────────────────────────────────────────
# AUTHENTICATION STACK — the REAL env contract (verified against the code)
# ─────────────────────────────────────────────────────────────────────────────
# The only auth SECRET is JWT_SECRET (above). It is the HS256 signing key for
# access tokens — minted in backend/core/auth/tokens.py and verified in
# backend/core/user_auth.py. Generate a strong value, e.g.:
#     python -c "import secrets; print(secrets.token_urlsafe(48))"
#
# There is intentionally NO separate refresh-token secret. Refresh tokens are
# OPAQUE high-entropy strings (secrets.token_urlsafe); only their SHA-256 hash
# is stored in the auth_sessions table (backend/core/auth/service.py). Nothing
# named AUTH_REFRESH_SECRET / AUTH_JWT_SECRET exists in the code — do not invent
# K8s secret keys with those names; the backend would never read them.
#
# JWT_ISSUER / JWT_AUDIENCE are NON-secret identifiers and live in the
# `lawapp-config` ConfigMap (canonical values: lawapp-issuer / lawapp-audience).
# Do NOT also put them in this Secret (envFrom secretRef overrides configMapRef
# and would create two sources of truth).
#
# SOCIAL SIGN-IN (Google / Microsoft / Apple / LinkedIn) is OIDC id-token
# verification (backend/core/auth/providers.py). It uses ONLY the public client
# id of each provider and NO client secret — so there is NOTHING secret to store
# for OAuth. The client ids are public values; set them (only when you have real
# ones) in the `lawapp-config` ConfigMap, e.g.:
#     OAUTH_GOOGLE_CLIENT_ID, OAUTH_MICROSOFT_CLIENT_ID, OAUTH_APPLE_CLIENT_ID,
#     OAUTH_LINKEDIN_CLIENT_ID  (comma-separated allowed for web+native).
# A provider with no client id is cleanly DISABLED (fail-closed 503) — never a
# fake success.
