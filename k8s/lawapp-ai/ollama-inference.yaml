apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ollama-inference
  namespace: lawapp-ai
  labels:
    app: ollama-inference
    component: inference
    part-of: lawapp
spec:
  selector:
    matchLabels:
      app: ollama-inference
  template:
    metadata:
      labels:
        app: ollama-inference
        component: inference
        part-of: lawapp
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "16Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-inference
  namespace: lawapp-ai
  labels:
    app: ollama-inference
    part-of: lawapp
spec:
  selector:
    app: ollama-inference
  ports:
    - name: http
      port: 11434
      targetPort: 11434
