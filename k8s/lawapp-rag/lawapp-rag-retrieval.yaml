apiVersion: apps/v1
kind: Deployment
metadata:
  name: lawapp-rag-retrieval
  namespace: lawapp-rag
  labels:
    app: lawapp-rag-retrieval
    component: lawapp-rag-retrieval
    part-of: lawapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lawapp-rag-retrieval
  template:
    metadata:
      labels:
        app: lawapp-rag-retrieval
        component: lawapp-rag-retrieval
        part-of: lawapp
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: lawapp-rag-retrieval
          image: ghcr.io/serverax/lawapp-rag-retrieval:b13c59d01e73e861b35498cac2b37d566609c262
          imagePullPolicy: Always
          command: ["uvicorn"]
          args: ["services.lawapp_rag_retrieval.app:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: "lawapp-rag-retrieval"
            - name: LOG_FORMAT
              value: "json"
          envFrom:
            - configMapRef:
                name: lawapp-rag-config
                optional: true
            - secretRef:
                name: lawapp-rag-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: lawapp-rag-retrieval
  namespace: lawapp-rag
  labels:
    app: lawapp-rag-retrieval
    part-of: lawapp
spec:
  selector:
    app: lawapp-rag-retrieval
  ports:
    - name: http
      port: 8080
      targetPort: 8080
